name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: normalize Windows checkout for formatting checks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout -- .
      - run: go build ./...
      - run: go vet ./...
      - name: verify formatting and module files
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -count=1 -shuffle=on -timeout 10m ./...
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go test -race -count=1 -shuffle=on -timeout 10m ./internal/... ./tests/...
